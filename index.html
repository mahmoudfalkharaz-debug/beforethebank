<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Before The Bank - The Financial Operating System for the Middle East</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-black text-white">
<div class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
<div class="inline-flex px-4 py-2 bg-yellow-400 text-black rounded-full text-sm font-bold mb-8">🚀 LAUNCHING SOON</div>
<h1 class="text-5xl md:text-8xl font-black mb-6">BEFORE<br><span class="text-yellow-400">THE BANK.</span></h1>
<p class="text-xl text-gray-400 max-w-2xl mb-10">The Financial Operating System for the Middle East. Built for the 70% who build the economy, not the banks that serve the 1%.</p>
<div class="bg-white/5 border border-white/10 rounded-2xl p-6 w-full max-w-md">
<h3 class="font-bold mb-4">Join the Waitlist</h3>
<input id="email" type="email" placeholder="your@email.com" class="w-full p-4 rounded-xl bg-black border border-white/20 text-white mb-3">
<button onclick="join()" class="w-full p-4 bg-yellow-400 text-black font-black rounded-xl">JOIN WAITLIST →</button>
<p id="msg" class="mt-3 text-green-400 hidden">✅ You're on the list!</p>
</div>
<p class="mt-10 text-gray-600 text-sm">beforethebank.co | Built in Amman</p>
</div>
<script>
function join(){
const email=document.getElementById('email').value;
if(!email.includes('@')){alert('Enter valid email');return}
document.getElementById('msg').classList.remove('hidden');
document.getElementById('email').value='';
localStorage.setItem('waitlist',email);
}
</script>
</body>
</html>
